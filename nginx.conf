server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: react-router maneja las rutas del cliente; cualquier path que no
    # sea un archivo real cae al index (history fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La app se construye con VITE_API_URL=/api y pega acá con el prefijo.
    # El upstream NO es un hostname horneado: es el template ${API_UPSTREAM}
    # (URL COMPLETA con esquema) que el entrypoint oficial de nginx
    # materializa (envsubst) al arrancar.
    #   - docker compose:  API_UPSTREAM=http://backend:3000 (ENV del Dockerfile)
    #   - Render:          API_UPSTREAM=https://<url pública del backend>
    #
    # Sobre "fail-fast": los hostnames de proxy_pass NO se resuelven en el boot
    # (resolución perezosa). Un upstream roto NO aborta el arranque de nginx:
    # el server levanta igual y cada request a /api/ responde 502. Sólo hay
    # abort real al arrancar si el nombre, ya resuelto, no existe como host
    # (error de resolución de DNS → nginx no levanta). Por eso el CI job
    # `nginx-template` valida el config renderizado y verifica que /api/health
    # dé 502 (fallo ruidoso) y no 200 (fallo silencioso).
    #
    # Nota: el prefijo es `/api/` con barra. El path exacto "/api" NO matchea
    # esta location y cae en la rama SPA de abajo (index.html). Es intencional:
    # la SPA habla siempre con /api/... (con barra), nunca con /api pelado.
    location /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
