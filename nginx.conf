server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: react-router maneja las rutas del cliente; cualquier path que no
    # sea un archivo real cae al index (history fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La app se construye con VITE_API_URL=/api y pega acá con el prefijo.
    # Se reenvía al servicio "backend" de compose quitando el prefijo
    # (/api/auth/login -> /auth/login).
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}