server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: react-router maneja las rutas del cliente; cualquier path que no
    # sea un archivo real cae al index (history fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La app se construye con VITE_API_URL=/api y pega acá con el prefijo.
    # El upstream NO es un hostname horneado: es el template ${API_UPSTREAM}
    # (URL COMPLETA con esquema) que el entrypoint oficial de nginx
    # materializa (envsubst) al arrancar.
    #   - docker compose:  API_UPSTREAM=http://backend:3000 (ENV del Dockerfile)
    #   - Render:          API_UPSTREAM=https://<url pública del backend>
    #
    # Sobre "fail-fast" (VERIFICADO por el CI job `nginx-template`, 2026-10-02):
    # con un upstream estático como este, nginx resuelve el hostname del
    # proxy_pass en la fase de CONFIGURACIÓN (al boot). Si el hostname NO
    # resuelve, nginx ABORTA el arranque: [emerg] host not found in upstream
    # (el contenedor muere — no hay 502 "por request" para hosts irresolubles).
    # La "resolución perezosa" (502 por request sin abort) solo aplica con
    # `resolver` + una variable en proxy_pass, que NO es el caso de este
    # template. Si el hostname resuelve pero el servicio está caído, nginx
    # levanta igual y cada request a /api/ responde 502 (connection refused /
    # timeout). Por eso el CI job valida el config renderizado con upstreams
    # RESOLUBLES (127.0.0.1 sin servicio → 502; example.com → nunca 200) y
    # verifica que /api/health falle ruidoso y no 200 (fallo silencioso).
    #
    # Nota: el prefijo es `/api/` con barra. El path exacto "/api" NO matchea
    # esta location y cae en la rama SPA de abajo (index.html). Es intencional:
    # la SPA habla siempre con /api/... (con barra), nunca con /api pelado.
    location /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
