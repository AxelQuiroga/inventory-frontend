name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (lint + test + typecheck e2e + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (lockfile congelado)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck de los specs e2e
        run: npm run typecheck:e2e

      - name: Tests unitarios/componentes (vitest + jsdom)
        run: npm test

      - name: Build
        run: npm run build

  nginx-template:
    name: Nginx template (envsubst + proxy /api fail-loud)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # El template nginx.conf solo se materializa con envsubst DENTRO del
      # contenedor: ningún test de Vitest lo cubre (el job `frontend` no tiene
      # paso de docker). Este job es la única red de seguridad: un typo en
      # ${API_UPSTREAM}, un COPY roto o un upstream mal escrito tienen que
      # romper CI, no producción.
      - name: Build de la imagen del frontend
        run: docker build -t inventory-frontend-check .

      # Upstream A: IP literal 127.0.0.1 SIN servicio en un puerto cerrado.
      # Resuelve siempre (no depende de DNS del runner) → nginx ARRANCA, pero
      # cada request a /api/ choca contra connection refused → 502. Esto prueba
      # el fallo ruidoso SIN el caso de hostname irresoluble (que aborta el
      # boot entero del contenedor, verificado el 2026-10-02: con un hostname
      # que no resuelve nginx muere en la fase de configuración y el contenedor
      # con --rm desaparece antes de que el job pueda hacer docker exec).
      - name: Boot con upstream interno roto (127.0.0.1:65000 -> 502)
        run: |
          docker run --rm -d --name nginx-check-internal \
            -e API_UPSTREAM=http://127.0.0.1:65000 -p 8080:80 \
            inventory-frontend-check
          sleep 5

      # Upstream B: host externo REAL y resoluble (example.com) en lugar de un
      # dominio Render que puede no resolver en el runner. example.com nunca
      # devuelve 200 para /api/health (404 del lado de ese host) → valida el
      # camino HTTPS del proxy sin depender de DNS de onrender.com.
      - name: Boot con upstream externo (https://example.com -> nunca 200)
        run: |
          docker run --rm -d --name nginx-check-external \
            -e API_UPSTREAM=https://example.com -p 8081:80 \
            inventory-frontend-check
          sleep 5

      - name: nginx -t sobre el config YA materializado por envsubst
        run: |
          for c in nginx-check-internal nginx-check-external; do
            echo "== $c =="
            docker exec "$c" nginx -t
          done

      - name: "envsubst: sin ${...} residuales y con el upstream inyectado"
        run: |
          for c in nginx-check-internal nginx-check-external; do
            echo "== $c =="
            docker exec "$c" grep -n 'proxy_pass' /etc/nginx/conf.d/default.conf
            if docker exec "$c" grep -q '\${' /etc/nginx/conf.d/default.conf; then
              echo "::error::$c tiene \${...} sin sustituir: envsubst no corrió sobre el template"
              docker exec "$c" grep -n '\${' /etc/nginx/conf.d/default.conf
              exit 1
            fi
            echo "OK: sin \${...} residuales"
          done
          # Y que el valor inyectado sea el que quedó (no un default mudo)
          docker exec nginx-check-internal grep -q 'proxy_pass http://127.0.0.1:65000/;' \
            /etc/nginx/conf.d/default.conf
          docker exec nginx-check-external grep -q 'proxy_pass https://example.com/;' \
            /etc/nginx/conf.d/default.conf
          echo "OK: API_UPSTREAM llegó al config renderizado en ambos"

      - name: /api/health falla ruidosamente (502/4xx) en vez de fingir salud (200)
        run: |
          code_interno="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health)"
          echo "interno (127.0.0.1:65000, puerto cerrado) -> $code_interno"
          if [ "$code_interno" != "502" ]; then
            echo "::error::se esperaba 502 (connection refused) y llegó $code_interno"
            exit 1
          fi

          code_externo="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/health)"
          echo "externo (https://example.com) -> $code_externo"
          # example.com responde 404/4xx para /api/health: el requisito es que
          # NUNCA sea 200. Un 200 con el upstream devolviendo otra cosa
          # significaría que el probe no recorre el proxy y reporta "ok"
          # mintiendo (el zombie que healthCheckPath: /api/health evita en Render).
          if [ "$code_externo" = "200" ]; then
            echo "::error::200 con upstream que no responde /api/health: el probe no recorre el proxy"
            exit 1
          fi

      - name: La rama SPA sigue intacta (comportamiento que NO se cambia)
        run: |
          code_spa="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
          echo "SPA / -> $code_spa"
          test "$code_spa" = "200"

      - name: Limpieza (también si el job falló antes)
        if: always()
        run: docker rm -f nginx-check-internal nginx-check-external || true

  e2e:
    name: Frontend E2E (Playwright + backend real + Postgres)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventory_system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/inventory_system
    steps:
      - uses: actions/checkout@v4

      # El webServer del Playwright levanta el backend real con cwd ./../backend
      # (backend/scripts/e2e-server.ts): necesita el fuente del backend al lado.
      # actions/checkout@v4 NO permite un path que escape del workspace (error
      # "Repository path ... is not under ..."), por eso se clona con git
      # directo. Repos PÚBLICOS → clone anónimo. Si el backend volviera a
      # PRIVADO, agregar x-access-token:<secret> a la URL (el GITHUB_TOKEN de
      # una cuenta personal NO alcanza para repos de otro dueño).
      - name: Checkout del backend (requerido por el e2e)
        run: |
          git clone --depth 1 \
            "https://github.com/${{ github.repository_owner }}/${{ vars.BACKEND_REPO || 'inventory-backend' }}.git" \
            ../backend

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias frontend (lockfile congelado)
        run: npm ci

      - name: Instalar dependencias backend (tsx, pg y drizzle son del backend)
        working-directory: ../backend
        run: npm ci

      - name: Crear base de tests (inventory_system_test)
        working-directory: ../backend
        run: |
          node --input-type=module -e "
          import { Client } from 'pg';
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            await client.query('CREATE DATABASE inventory_system_test');
            console.log('inventory_system_test creada');
          } catch (err) {
            if (err.code !== '42P04') throw err;
            console.log('inventory_system_test ya existía');
          }
          await client.end();
          "

      - name: Aplicar schema a la base de tests
        working-directory: ../backend
        run: npm run db:push:test

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests e2e (browser -> vite -> backend real -> Postgres)
        run: npm run test:e2e

      - name: Subir reporte Playwright (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
